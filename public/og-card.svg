<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#09090B" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- PCB Circuit Schematic Accents -->
  <g stroke="#10B981" stroke-width="2" stroke-opacity="0.4" fill="none">
    <path d="M 120 180 L 260 180 L 300 220 L 480 220" />
    <circle cx="120" cy="180" r="4" fill="#10B981" />
    <circle cx="480" cy="220" r="4" fill="#10B981" />
  </g>
  <g stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3" fill="none">
    <path d="M 1080 440 L 960 440 L 920 400 L 780 400" />
    <circle cx="1080" cy="440" r="4" fill="#38BDF8" />
    <circle cx="780" cy="400" r="4" fill="#38BDF8" />
  </g>

  <!-- Top Status Capsule -->
  <g transform="translate(100, 110)">
    <rect width="360" height="38" rx="19" fill="#111216" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="24" cy="19" r="5" fill="#10B981" />
    <text x="40" y="24" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="1">
      EEE @ NITK · EX-ISRO URSC INTERN
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="240" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Saivarshith Mitukula
  </text>

  <!-- Subtitle -->
  <text x="100" y="300" fill="#E4E4E7" font-family="'Inter', sans-serif" font-size="28" font-weight="500">
    Digital Silicon, Power Electronics &amp; Software Systems
  </text>

  <!-- Description Line -->
  <text x="100" y="348" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="20" font-weight="400">
    Pipelined RV32IM RISC-V RTL · Space-Grade Power Converters · Developer Tools
  </text>

  <!-- Hardware Telemetry Specs Grid -->
  <g transform="translate(100, 420)">
    <!-- Spec Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="220" height="80" rx="12" fill="#111216" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="18" y="32" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">MICROARCHITECTURE</text>
      <text x="18" y="58" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">RV32IM (1.57 CPI)</text>
    </g>

    <!-- Spec Card 2 -->
    <g transform="translate(240, 0)">
      <rect width="220" height="80" rx="12" fill="#111216" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="18" y="32" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">SPACE CONVERTER</text>
      <text x="18" y="58" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">100 kHz (5V @ 4A)</text>
    </g>

    <!-- Spec Card 3 -->
    <g transform="translate(480, 0)">
      <rect width="220" height="80" rx="12" fill="#111216" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="18" y="32" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">VLSI FOUNDRY</text>
      <text x="18" y="58" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">SKY130 PDK CMOS</text>
    </g>

    <!-- Spec Card 4 -->
    <g transform="translate(720, 0)">
      <rect width="260" height="80" rx="12" fill="#111216" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="18" y="32" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">CORE PHILOSOPHY</text>
      <text x="18" y="58" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">DESIGN · BUILD · VERIFY</text>
    </g>
  </g>

  <!-- Bottom Brand Mark -->
  <text x="100" y="560" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">
    saivarshithm.dev
  </text>
</svg>
